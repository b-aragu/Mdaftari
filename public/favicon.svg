<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Notebook/Ledger Icon -->
  <g fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book outline -->
    <rect x="120" y="100" width="272" height="312" rx="20" fill="white" fill-opacity="0.15"/>
    <!-- Spine -->
    <line x1="170" y1="100" x2="170" y2="412"/>
    <!-- Lines -->
    <line x1="210" y1="180" x2="340" y2="180"/>
    <line x1="210" y1="240" x2="340" y2="240"/>
    <line x1="210" y1="300" x2="340" y2="300"/>
    <!-- Coin/Money symbol -->
    <circle cx="275" cy="360" r="40" fill="white" fill-opacity="0.3"/>
    <text x="275" y="375" text-anchor="middle" fill="white" font-size="48" font-weight="bold" font-family="Arial" stroke="none">₭</text>
  </g>
</svg>
